<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planit AI</title>
  <meta name="description" content="Collectionnez les cartes Mythoria, ouvrez des boosters et forgez votre deck.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="bg-[#F0F8FF] flex justify-between h-[80px]">
        <a class="w-[150px] h-[60px] mt-[5px] border-2 rounded-[14px]" href="index.html"><img src="img/LOGO.png" alt=""></a>
        <nav>
            <ul class="flex items-center gap-7 mt-[25px]">
                <li><a class="mt-[20px] mb-[20px] min-w-[170px] px-6 py-4  border-2 rounded-[14px] text-center" href="index.html">Dashboard</a></li>
                <li><a class=" min-w-[170px] px-6 py-4 text-center border-2 rounded-[14px]" href="new-project.html">Nouveau projet</a></li>
                <li><a class="min-w-[170px] px-6 py-4  border-2 rounded-[14px] text-center" href="project.html">parametres AI</a></li>
            </ul>
        </nav>
    </header>
    <div class="flex">
        <aside id="aside" class="bg-[#1E3A5F] w-60 min-h-screen shrink-0">
            <button id="NouveauProjet" class="min-w-[170px] mt-[50px] ml-[20px] px-6 py-4  rounded-[8px] text-center text-[#F0F8FF] hover:bg-blue-700">Dashboard</button>
            <button id="NouveauProjet" class="min-w-[170px] mt-[10px] ml-[20px] px-6 py-4  rounded-[8px] text-center text-[#F0F8FF] hover:bg-blue-700">Nouveau Projet</button>
            <button id="NouveauProjet" class="min-w-[170px] mt-[10px] ml-[20px] px-6 py-4  rounded-[8px] text-center text-[#F0F8FF] hover:bg-blue-700">Mes projets</button>
            <button id="NouveauProjet" class="min-w-[170px] mt-[10px] ml-[20px] px-6 py-4  rounded-[8px] text-center text-[#F0F8FF] hover:bg-blue-700">parametres AI</button>
            <button id="NouveauProjet" class="min-w-[170px] mt-[10px] ml-[20px] px-6 py-4  rounded-[8px] text-center text-[#F0F8FF] hover:bg-blue-700">Aide</button>
            
            <div id="divASIDE"></div>
        </aside>
        <div class="border-2 rounded-[10px] h-full p-6 gap-2 ml-[20px] w-full">
            <h2 class="text-3xl font-bold text-[#122B50] mb-3">Créer un nouveau projet</h2>
            <p class="text-gray-500 text-lg ">Remplissez les informations pour générie votre plan de développement avec l'IA</p>
        <form action="" class=" flex flex-col  h-full p-6 gap-2 ml-[20px] my-2 w-full ">
                <div class="flex flex-col gap-2 w-full h-auto">
                <label for="Nom" class="text-[#122B50] font-semibold text-base">Nom du projet :</label>
                <input type="text" id="projectName" class="w-[300px] border-2 rounded-[10px] p-3" placeholder="Nom du projet" required>
                </div>

                <div class="flex flex-col gap-2 w-full h-auto">
                <label for="description" class="text-[#122B50] font-semibold text-base">Description :</label>
                <textarea id="description" class="w-[100%] h-[50px] border-2 rounded-[10px] p-3"placeholder="Description du projet"required></textarea>
                </div>

                <div class="flex flex-col gap-2 w-full h-auto">
                <label for="Brief" class="text-[#122B50] font-semibold text-base"> Brief complet :</label>
                <textarea id="description" class="w-full h-[50px] border-2 rounded-[10px] p-3"placeholder="Fonctionnalités, objectifs, contraintes..."required></textarea>
                </div>

                <div class="flex gap-10 w-full h-auto">
                        <div class="flex flex-col  gap-2">
                        <label for="duree" class="text-[#122B50] font-semibold text-base"> Durée (jours) :</label>
                        <input type="number" id="duree" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="Ex : 9">
                   </div>
                        <div class="flex flex-col gap-2 ml-[330px]">
                        <label for="developpeurs" class="text-[#122B50] font-semibold text-base">Developpeurs :</label>
                        <input type="number" id="developpeurs" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="Ex : 3">
                        </div>
                </div>
                <div class="flex gap-20">
                <div class="flex flex-col gap-2 w-[500px] h-auto">
                        <label for="technologies" class="text-[#122B50] font-semibold text-base"> Technologies :</label>
                        <input type="text" name="" id="technologies" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="JAVAScript , CSS ...">
                </div>
                <div class="flex flex-col w-[30%]">
                    <label for="difficulty" class="text-[#122B50] font-semibold text-base">Niveau de difficulté :</label>
                    <select id="difficulty" class="w-[100%] border-2 rounded-[10px] p-3 mt-3 text-gray-500 text-lg " required>
                    <option value="" class="hidden">Choisir un niveau</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    </select>
                </div>
                </div>
                <div class="flex justify-center mx-[25%] mt-4">
                    <button class=" w-full  bg-blue-600 text-white p-3 rounded-[10px] hover:bg-blue-700">Générer le plan de développement</button>
                </div>
        </form>
        </div>
    </div>
</body>
</html>
