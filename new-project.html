        <div class="border-2 rounded-[10px] h-full p-6 gap-2 ml-[20px] w-full">
            <h2 class="text-3xl font-bold text-[#122B50] mb-3">Créer un nouveau projet</h2>
            <p class="text-gray-500 text-lg ">Remplissez les informations pour générie votre plan de développement avec l'IA</p>
       
            <form id="validationForm" action="" class=" flex flex-col  h-full p-6 gap-2 ml-[20px] my-2 w-full " data-parsley-validate data-parsley-trigger="input change">
                <div id="formValidation" class="flex flex-col gap-2 w-full h-auto">
                <label for="Nom" class="text-[#122B50] font-semibold text-base">Nom du projet :</label>
                <input type="text" id="Nom" class="w-[300px] border-2 rounded-[10px] p-3" placeholder="Nom du projet" required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." data-parsley-minlength="3" data-parsley-minlength-message="Le nom doit contenir au moins 3 caractères.">
                </div>

                <div id="formValidation" class="flex flex-col gap-2 w-full h-auto">
                <label for="description" class="text-[#122B50] font-semibold text-base">Description :</label>
                <textarea id="description" class="w-[100%] h-[50px] border-2 rounded-[10px] p-3"placeholder="Description du projet"required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." data-parsley-minlength="10" data-parsley-minlength-message="La description doit contenir au moins 10 caractères."></textarea>
                </div>

                <div id="formValidation" class="flex flex-col gap-2 w-full h-auto">
                <label for="Brief" class="text-[#122B50] font-semibold text-base"> Brief complet :</label>
                <textarea id="Brief" class="w-full h-[50px] border-2 rounded-[10px] p-3"placeholder="Fonctionnalités, objectifs, contraintes..."required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." data-parsley-minlength="30"data-parsley-minlength-message="Le brief doit contenir au moins 30 caractères."></textarea>
                </div>

                <div class="flex gap-10 w-full h-auto">
                        <div id="formValidation" class="flex flex-col  gap-2">
                        <label for="duree" class="text-[#122B50] font-semibold text-base"> Durée (jours) :</label>
                        <input type="number" id="duree" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="Ex : 9" required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." min="1"data-parsley-min-message="La durée doit être au moins égale à 1.">
                   </div>
                        <div id="formValidation" class="flex flex-col gap-2 ml-[330px]">
                        <label for="developpeurs" class="text-[#122B50] font-semibold text-base">Developpeurs :</label>
                        <input type="number" id="developpeurs" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="Ex : 3" required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." min="1" data-parsley-min-message="Le nombre de développeurs doit être au moins égal à 1."> 
                        </div>
                </div>
                <div class="flex gap-20">
                <div id="formValidation" class="flex flex-col gap-2 w-[500px] h-auto">
                        <label for="technologies" class="text-[#122B50] font-semibold text-base"> Technologies :</label>
                        <input type="text" name="" id="technologies" class="w-[100%] border-2 rounded-[10px] p-3" placeholder="JAVAScript , CSS ..." required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir." data-parsley-minlength="2" data-parsley-required-message="Indique au moins une technologie.">
                </div>
                <div id="formValidation" class="flex flex-col w-[30%]">
                    <label for="difficulty" class="text-[#122B50] font-semibold text-base">Niveau de difficulté :</label>
                    <select id="difficulty" class="w-[100%] border-2 rounded-[10px] p-3 mt-3 text-gray-500 text-lg " required data-parsley-required-message="Ce champ est obligatoire. Veuillez le remplir.">
                    <option value="" class="hidden">Choisir un niveau</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    </select>
                </div>
                </div>
                <div class="flex justify-evenly gap-20 mx-[25%] mt-4">
                    <button id="btnSubmit" type="submit" disabled class="w-full bg-blue-600 text-white p-3 rounded-[10px] hover:bg-blue-700  disabled:cursor-not-allowed">Générer le plan de développement</button>
                    <button id="demoBtn" type="button" class="w-full bg-blue-600 text-white text-center p-3 rounded-[10px] hover:bg-blue-700 ">Demo </button>
                </div>
        </form>
        </div>
    </div>
